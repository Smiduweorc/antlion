name: CI

on:
  push:
    branches: [master, dev]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Build (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Compliance gate
        run: npm run compliance

      - name: Build project
        run: npm run build

      - name: Test the built artifact
        run: npm run test:dist

      - name: Generate API docs
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        run: npm run docs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
        with:
          name: dist
          path: dist/

      - name: Upload compliance report
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x' && always()
        with:
          name: compliance-report
          path: compliance-report.md

  # What needs something outside Node: the shared replay stores against a
  # real Redis and Postgres, several processes sharing them, and Nimbus (Java)
  # as a live client. Service containers only run on Linux runners; what the
  # stores send is plain protocol, so the client's operating system changes
  # nothing here, and the unit tests for both stores run on every leg above.
  services:
    name: Redis, Postgres and Nimbus
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        # Redis's default maxmemory-policy is noeviction, which is what the
        # deployment guide asks for.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - 6379:6379
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: antlion
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - 5432:5432

    env:
      ANTLION_TEST_REDIS_URL: redis://localhost:6379
      ANTLION_TEST_POSTGRES_URL: postgres://postgres:antlion@localhost:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: tools/golden/nimbus/pom.xml

      - name: Fetch the Nimbus jars
        working-directory: tools/golden/nimbus
        run: mvn -q dependency:copy-dependencies -DoutputDirectory=lib

      - name: Install dependencies
        run: npm ci

      - name: Run the service tests
        run: npm run test:services
